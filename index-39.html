<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOPF AMATA POS</title><style>

*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:#f2f4f6;color:#17202a}
header{height:64px;background:#101820;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
nav{display:flex;gap:10px}nav a{color:#fff;text-decoration:none;padding:9px 12px;border-radius:9px;background:#26323d}
.wrap{padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:1px solid #dde3e8;border-radius:14px;padding:14px;box-shadow:0 2px 8px #00000008}
.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:800;cursor:pointer}
.red{background:#c9252c;color:#fff}.green{background:#168d61;color:#fff}.amber{background:#e4a51d;color:#111}.dark{background:#26323d;color:#fff}
.layout{display:grid;grid-template-columns:1fr 380px;min-height:calc(100vh - 64px)}
.side{background:#fff;border-left:1px solid #ddd;padding:16px}.muted{color:#6b7785;font-size:12px}.price{font-size:20px;font-weight:900}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eee}
.ticket{background:#111b24;color:#fff;border-left:5px solid #e4a51d}.status{font-size:11px;font-weight:800}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{border-left:0}.grid{grid-template-columns:repeat(2,1fr)}}

</style></head><body><header><b>HOPF AMATA RESTAURANT OS</b><nav>
<a href="index.html">POS</a><a href="kds.html">KDS</a><a href="admin.html">BACK OFFICE</a>
</nav></header>
<div class="layout"><main class="wrap"><h2>Floor / Table</h2><div id="tables" class="grid"></div><h2>Menu</h2><div id="menu" class="grid"></div></main>
<aside class="side"><div class="muted">ACTIVE BILL</div><h2 id="billTitle">เลือกโต๊ะ</h2><div id="cart"></div><h2 id="total">฿0</h2>
<button class="btn amber" onclick="sendOrder()">SEND ORDER</button> <button class="btn green" onclick="pay()">PAY</button></aside></div>
<script>

const KEY='hopf_split_master_v1';
function seed(){
 let d=JSON.parse(localStorage.getItem(KEY)||'null'); if(d)return d;
 let tables=[];for(let i=1;i<=24;i++)tables.push({id:'T'+i,zone:'MAIN',status:'AVAILABLE'});
 for(let i=1;i<=6;i++)tables.push({id:'C'+i,zone:'C',status:'AVAILABLE'});
 for(let i=1;i<=6;i++)tables.push({id:'S'+i,zone:'OUTDOOR',status:'AVAILABLE'});
 for(let i=1;i<=3;i++)tables.push({id:'Room '+i,zone:'VIP',status:'AVAILABLE'});
 d={tables,products:[
 {id:'ribeye',name:'Ribeye Steak',price:450,station:'KITCHEN'},{id:'ribs',name:'BBQ Ribs',price:380,station:'KITCHEN'},
 {id:'pizza',name:'Pizza Salmon L',price:189,station:'KITCHEN'},{id:'fries',name:'French Fries',price:120,station:'KITCHEN'},
 {id:'ipa',name:'IPA 500 ml',price:220,station:'BAR'},{id:'lager',name:'Lager 500 ml',price:180,station:'BAR'},
 {id:'weizen',name:'Weizen Dunkel 500 ml',price:220,station:'BAR'},{id:'stout',name:'Stout 500 ml',price:220,station:'BAR'}],
 bills:[],kds:[],payments:[],audit:[],stock:{ribeye:30,ribs:30,pizza:30,fries:40,ipa:80,lager:80,weizen:60,stout:60}};
 save(d);return d
}
function db(){return seed()} function save(d){localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY+'_ping',Date.now())}
function id(p){return p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)}
function activeBill(d,t){return d.bills.find(b=>b.table===t&&!['PAID','VOID'].includes(b.status))}
window.addEventListener('storage',e=>{if(e.key===KEY+'_ping'&&typeof refresh==='function')refresh()});

</script><script>

let selected=null,bill=null,cart=[];
function refresh(){let d=db();tables.innerHTML=d.tables.map(t=>`<button class="card" onclick="openTable('${t.id}')"><b>${t.id}</b><br><span class="muted">${t.zone}</span><br><span class="status">${t.status}</span></button>`).join('');
menu.innerHTML=d.products.map(p=>`<button class="card" onclick="add('${p.id}')"><b>${p.name}</b><div class="muted">${p.station}</div><div class="price">฿${p.price}</div></button>`).join('');draw()}
function openTable(t){let d=db();selected=t;bill=activeBill(d,t);if(!bill){bill={id:id('BILL'),table:t,status:'OPEN',items:[],openedAt:new Date().toISOString()};d.bills.push(bill);d.tables.find(x=>x.id===t).status='OPEN';d.audit.unshift({at:new Date().toLocaleString(),action:'OPEN BILL',detail:t});save(d)}billTitle.textContent=t+' · '+bill.id;cart=[];refresh()}
function add(pid){if(!bill)return alert('เลือกโต๊ะก่อน');let p=db().products.find(x=>x.id===pid),e=cart.find(x=>x.productId===pid);e?e.qty++:cart.push({productId:pid,name:p.name,price:p.price,station:p.station,qty:1});draw()}
function draw(){cart.innerHTML=cart.map(x=>`<div class="row"><span>${x.qty}× ${x.name}</span><b>฿${x.qty*x.price}</b></div>`).join('')||'<p class="muted">ยังไม่มี Draft</p>';total.textContent='Draft ฿'+cart.reduce((s,x)=>s+x.qty*x.price,0)}
function sendOrder(){if(!bill||!cart.length)return;let d=db(),b=d.bills.find(x=>x.id===bill.id),batch=id('ORD');cart.forEach(x=>{let item={...x,id:id('ITEM'),batch,status:'SENT'};b.items.push(item);d.kds.push({id:id('KDS'),billId:b.id,table:b.table,itemId:item.id,name:item.name,qty:item.qty,station:item.station,status:'NEW',createdAt:Date.now()});d.stock[x.productId]=(d.stock[x.productId]||0)-x.qty});b.status='ORDERED';d.tables.find(x=>x.id===b.table).status='ORDERED';d.audit.unshift({at:new Date().toLocaleString(),action:'SEND ORDER',detail:b.table+' '+batch});save(d);cart=[];refresh()}
function pay(){if(!bill)return;let d=db(),b=d.bills.find(x=>x.id===bill.id),sum=b.items.reduce((s,x)=>s+x.price*x.qty,0);if(!sum)return alert('ยังไม่มีรายการ');let method=prompt('CASH / QR / CARD / TRANSFER','CASH')||'CASH';d.payments.push({id:id('PAY'),billId:b.id,amount:sum,method,at:new Date().toISOString()});b.status='PAID';d.tables.find(x=>x.id===b.table).status='AVAILABLE';d.audit.unshift({at:new Date().toLocaleString(),action:'PAY '+method,detail:b.table+' ฿'+sum});save(d);bill=null;selected=null;billTitle.textContent='เลือกโต๊ะ';refresh()}
refresh();

</script></body></html>
