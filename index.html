<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HOPF AMATA POS Core V8</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:#f3f5f7;color:#17202a}
button,input{font:inherit}.hide{display:none!important}.top{height:58px;background:#111b24;color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px}.brand{font-weight:950}.grow{flex:1}.tag{background:#263440;padding:7px 10px;border-radius:999px;font-size:12px}
.nav{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:20}.nav button{flex:1;border:0;background:#fff;padding:13px 4px;font-weight:850}.nav .on{color:#df252c;border-bottom:3px solid #df252c}
.view{padding:12px;max-width:1400px;margin:auto}.zone{font-weight:950;margin:16px 0 7px}.tables{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.table{min-height:76px;border:0;border-radius:14px;color:#fff;font-weight:950}.FREE{background:#11a66b}.BUSY{background:#e44444}.READY{background:#2788d7}.BOOKED{background:#6d747a}
.order{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:10px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.product,.card{background:#fff;border:1px solid #dfe4e8;border-radius:14px;padding:12px}.product{min-height:105px;text-align:left}.price{color:#d8242c;font-weight:950}.bill{background:#fff;border-radius:14px;padding:13px;display:flex;flex-direction:column}.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.muted{color:#77818a;font-size:12px}.btn{border:0;border-radius:10px;padding:12px;font-weight:900}.red{background:#df252c;color:#fff}.green{background:#0ca66c;color:#fff}.dark{background:#263440;color:#fff}.blue{background:#2788d7;color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tickets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ticket{border-top:5px solid #df252c}.ticket.ready{border-top-color:#0ca66c}.big{font-size:25px;font-weight:950}
.modal{position:fixed;inset:0;background:#0009;z-index:100;display:grid;place-items:center;padding:12px}.box{width:min(760px,100%);max-height:90vh;overflow:auto;background:#f5f6f7;border-radius:20px;padding:15px}.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pick button{min-height:65px}
@media(max-width:850px){.tables{grid-template-columns:repeat(4,1fr)}.order{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}.tickets{grid-template-columns:1fr}.bill{min-height:300px}}
@media(max-width:520px){.tables{grid-template-columns:repeat(3,1fr)}.pick{grid-template-columns:repeat(3,1fr)}.nav button{font-size:11px}.view{padding:8px}}
</style></head><body>
<header class="top"><div class="brand">HOPF AMATA POS</div><div class="grow"></div><span class="tag">CORE V8</span></header>
<nav class="nav"><button data-go="floor" class="on">โต๊ะ</button><button data-go="order">ออเดอร์</button><button data-go="kds">ครัว / บาร์</button><button data-go="cashier">แคชเชียร์</button></nav>
<section id="floor" class="view"><h2>แผนผังโต๊ะ</h2><div class="muted">แตะโต๊ะเพื่อเปิด/กลับเข้าบิลเดิม</div><div id="zones"></div></section>
<section id="order" class="view hide"><div class="order"><main><h2 id="orderTitle">Order</h2><div id="products" class="products"></div></main><aside class="bill"><h3 id="billTitle"></h3><div id="items"></div><div class="row"><b>คงเหลือ</b><b id="balance">฿0</b></div><div class="actions"><button class="btn red" onclick="sendOrder()">ส่งครัว/บาร์</button><button class="btn green" onclick="openPay()">ชำระเงิน</button></div><button class="btn dark" style="margin-top:7px" onclick="billManage()">จัดการบิล</button></aside></div></section>
<section id="kds" class="view hide"><h2>KDS</h2><div id="tickets" class="tickets"></div></section>
<section id="cashier" class="view hide"><h2>Cashier</h2><div id="cash" class="tickets"></div></section>
<div id="modal" class="modal hide"><div class="box"><div id="modalBody"></div><button class="btn" style="width:100%;margin-top:10px" onclick="closeModal()">ปิด</button></div></div>
<script>
const KEY='hopf_core_v8';
const seedProducts=[['Ribeye Steak',450,'KITCHEN'],['BBQ Ribs',380,'KITCHEN'],['Pizza Salmon L',189,'KITCHEN'],['Spicy Pork Neck',160,'KITCHEN'],['French Fries',120,'KITCHEN'],['IPA 500 ml',220,'BAR'],['Lager 500 ml',180,'BAR'],['Weizen Dunkel 500 ml',220,'BAR'],['Stout 500 ml',220,'BAR']];
function fresh(){let tables=[];for(let i=1;i<=24;i++)tables.push({id:'T'+i,zone:'โซนหลัก',status:'FREE'});for(let i=1;i<=6;i++)tables.push({id:'C'+i,zone:'Zone C',status:'FREE'});for(let i=1;i<=6;i++)tables.push({id:'S'+i,zone:'Outdoor',status:'FREE'});for(let i=1;i<=3;i++)tables.push({id:'Room '+i,zone:'VIP Room',status:'FREE'});return{tables,products:seedProducts.map((x,i)=>({id:'P'+i,name:x[0],price:x[1],station:x[2]})),bills:[],kds:[],payments:[],audit:[]}}
let D=JSON.parse(localStorage.getItem(KEY)||'null')||fresh(),selected=null;
const uid=p=>p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
const getBillByTable=t=>D.bills.find(b=>b.table===t&&['OPEN','ORDERED','READY','BILLING'].includes(b.status));
const current=()=>selected?getBillByTable(selected):null;
const gross=b=>(b.items||[]).filter(x=>x.status!=='VOID').reduce((s,x)=>s+x.price*x.qty,0);
const paid=b=>D.payments.filter(p=>p.billId===b.id).reduce((s,p)=>s+p.amount,0);
const remain=b=>Math.max(0,gross(b)-paid(b));
function save(action,detail){if(action)D.audit.unshift({at:Date.now(),action,detail});localStorage.setItem(KEY,JSON.stringify(D));renderAll()}
function go(id){document.querySelectorAll('.view').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('on',x.dataset.go===id));renderAll()}
document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));
function openTable(t){let b=getBillByTable(t);if(!b){let pax=Number(prompt('จำนวนลูกค้า (PAX)','2')||2);b={id:uid('B'),table:t,pax,status:'OPEN',draft:[],items:[],openedAt:Date.now()};D.bills.push(b);D.tables.find(x=>x.id===t).status='BUSY';save('OPEN BILL',t)}selected=t;go('order')}
function add(pid){let b=current();if(!b)return alert('เลือกโต๊ะก่อน');let p=D.products.find(x=>x.id===pid),x=b.draft.find(x=>x.productId===pid);if(x)x.qty++;else b.draft.push({id:uid('I'),productId:p.id,name:p.name,price:p.price,station:p.station,qty:1,status:'DRAFT'});save()}
function sendOrder(){let b=current();if(!b||!b.draft.length)return alert('ไม่มีรายการใหม่');let batch=uid('ORD');b.draft.forEach(x=>{x.status='SENT';x.batch=batch;b.items.push(x);D.kds.push({id:uid('K'),billId:b.id,table:b.table,name:x.name,qty:x.qty,station:x.station,status:'NEW',batch})});b.draft=[];b.status='ORDERED';save('SEND',b.table+' '+batch)}
function ready(id){let k=D.kds.find(x=>x.id===id);if(!k)return;k.status='READY';let b=D.bills.find(x=>x.id===k.billId);b.status='READY';D.tables.find(x=>x.id===b.table).status='READY';save('READY',k.table+' '+k.name)}
function served(id){let k=D.kds.find(x=>x.id===id);if(!k)return;k.status='SERVED';let b=D.bills.find(x=>x.id===k.billId);if(!D.kds.some(x=>x.billId===b.id&&!['SERVED','CANCELLED'].includes(x.status))){b.status='ORDERED';D.tables.find(x=>x.id===b.table).status='BUSY'}save('SERVED',k.table+' '+k.name)}
function openPay(){let b=current();if(!b||!b.items.length)return alert('ยังไม่มีรายการส่งแล้ว');show(`<h2>ชำระเงิน ${b.table}</h2><div class="big">คงเหลือ ฿${remain(b).toLocaleString()}</div>${['CASH','QR','CARD','TRANSFER'].map(m=>`<button class="btn green" style="width:100%;margin-top:7px" onclick="pay('${m}')">${m}</button>`).join('')}`)}
function pay(method){let b=current(),r=remain(b);if(!b||r<=0)return;D.payments.push({id:uid('PAY'),billId:b.id,table:b.table,method,amount:r,at:Date.now()});b.status='CLOSED';D.tables.find(x=>x.id===b.table).status='FREE';save('PAY',b.table+' '+method+' '+r);selected=null;closeModal();go('floor')}
function billManage(){let b=current();if(!b)return;show(`<h2>จัดการบิล ${b.table}</h2><button class="btn dark" style="width:100%;margin:5px 0" onclick="pickTable('MOVE')">ย้ายโต๊ะ</button><button class="btn dark" style="width:100%;margin:5px 0" onclick="pickTable('MERGE')">รวมโต๊ะ</button><button class="btn green" style="width:100%;margin:5px 0" onclick="splitPay()">แยกจ่าย</button>`)}
function pickTable(mode){let b=current();modalBody.innerHTML=`<h2>${mode==='MOVE'?'ย้ายโต๊ะ '+b.table:'รวมโต๊ะเข้า '+b.table}</h2><div class="pick">${D.tables.map(t=>{let has=!!getBillByTable(t.id),ok=mode==='MOVE'?(!has&&t.id!==b.table):(has&&t.id!==b.table);return `<button class="btn ${has?'red':'green'}" ${ok?`onclick="chooseTable('${mode}','${t.id}')"`:'disabled'}>${t.id}<br>${has?'BUSY':'FREE'}</button>`}).join('')}</div>`}
function chooseTable(mode,t){let b=current();if(mode==='MOVE'){let old=b.table;b.table=t;D.tables.find(x=>x.id===old).status='FREE';D.tables.find(x=>x.id===t).status='BUSY';D.kds.filter(k=>k.billId===b.id).forEach(k=>k.table=t);selected=t;save('MOVE',old+'>'+t)}else{let src=getBillByTable(t);src.items.forEach(x=>b.items.push(x));src.draft.forEach(x=>b.draft.push(x));D.kds.filter(k=>k.billId===src.id).forEach(k=>{k.billId=b.id;k.table=b.table});src.status='MERGED';D.tables.find(x=>x.id===t).status='FREE';save('MERGE',t+'>'+b.table)}closeModal();go('order')}
function splitPay(){let b=current(),r=remain(b),a=Number(prompt('คงเหลือ ฿'+r+' จำนวนที่จะรับ',r)||0);if(a<=0||a>r)return;let m=(prompt('CASH / QR / CARD / TRANSFER','CASH')||'CASH').toUpperCase();D.payments.push({id:uid('PAY'),billId:b.id,table:b.table,method:m,amount:a,at:Date.now()});if(remain(b)<=0){b.status='CLOSED';D.tables.find(x=>x.id===b.table).status='FREE';selected=null}save('SPLIT PAY',b.table+' '+a);closeModal();if(!selected)go('floor')}
function show(h){modalBody.innerHTML=h;modal.classList.remove('hide')}function closeModal(){modal.classList.add('hide')}
function renderFloor(){zones.innerHTML=['โซนหลัก','Zone C','Outdoor','VIP Room'].map(z=>`<div class="zone">${z}</div><div class="tables">${D.tables.filter(t=>t.zone===z).map(t=>`<button class="table ${t.status}" onclick="openTable('${t.id}')">${t.id}<br><small>${t.status}</small></button>`).join('')}</div>`).join('')}
function renderOrder(){let b=current();orderTitle.textContent=b?'Order · '+b.table:'Order';billTitle.textContent=b?`${b.table} · PAX ${b.pax}`:'เลือกโต๊ะก่อน';products.innerHTML=D.products.map(p=>`<button class="product" onclick="add('${p.id}')"><b>${p.name}</b><div class="muted">${p.station}</div><div class="price">฿${p.price}</div></button>`).join('');let xs=b?[...b.items,...b.draft]:[];items.innerHTML=xs.map(x=>`<div class="row"><span>${x.qty}× ${x.name}<br><small class="muted">${x.status}</small></span><b>฿${x.qty*x.price}</b></div>`).join('')||'<p class="muted">ยังไม่มีรายการ</p>';balance.textContent='฿'+(b?remain(b):0).toLocaleString()}
function renderKDS(){let xs=D.kds.filter(x=>!['SERVED','CANCELLED'].includes(x.status));tickets.innerHTML=xs.map(x=>`<div class="card ticket ${x.status==='READY'?'ready':''}"><div class="row"><b>${x.table}</b><b>${x.station}</b></div><h3>${x.qty}× ${x.name}</h3>${x.status==='READY'?`<button class="btn blue" style="width:100%" onclick="served('${x.id}')">เสิร์ฟแล้ว → ออกจากจอ</button>`:`<button class="btn green" style="width:100%" onclick="ready('${x.id}')">เสร็จแล้ว ✓</button>`}</div>`).join('')||'<div class="card">ไม่มีออเดอร์ค้าง</div>'}
function renderCash(){let xs=D.bills.filter(b=>['OPEN','ORDERED','READY','BILLING'].includes(b.status)&&remain(b)>0);cash.innerHTML=xs.map(b=>`<div class="card"><div class="row"><b>${b.table}</b><b>฿${remain(b).toLocaleString()}</b></div><button class="btn green" style="width:100%" onclick="selected='${b.table}';openPay()">ชำระเงิน</button></div>`).join('')||'<div class="card">ไม่มีบิลค้างชำระ</div>'}
function renderAll(){renderFloor();renderOrder();renderKDS();renderCash()}renderAll();
</script></body></html>
