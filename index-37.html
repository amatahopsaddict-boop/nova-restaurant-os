<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#103a5b"><title>NOVA Restaurant OS • POS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f5f8fb;color:#142b3d}
button,input{font:inherit}.app{display:grid;grid-template-columns:188px minmax(600px,1fr) 350px;min-height:100vh}
.side{background:linear-gradient(180deg,#103c5d,#092b45);color:#fff;padding:24px 13px;position:relative}.brand{text-align:center;font-weight:950;font-size:25px;margin-bottom:28px}.brand small{display:block;font-size:9px;letter-spacing:2px;color:#9bd5ff}.nav{width:100%;border:0;background:transparent;color:#cce5f6;text-align:left;padding:13px;border-radius:13px;margin:3px 0}.nav.on{background:#ffffff1d;color:white;box-shadow:inset 3px 0 #65c0ff}.nav span{display:inline-block;width:28px}.quote{position:absolute;bottom:20px;left:13px;right:13px;background:#ffffff12;border-radius:16px;padding:14px;font-size:12px;color:#cce5f6}
.center{padding:20px 22px;overflow:auto}.top{display:flex;gap:12px}.search{flex:1;background:white;border:1px solid #dce8f1;border-radius:14px;padding:13px 16px;box-shadow:0 4px 18px #315f7f0a}.iconbtn{width:46px;border:1px solid #dce8f1;background:white;border-radius:14px}
.categories{display:flex;gap:9px;margin:18px 0;overflow:auto}.cat{min-width:90px;border:1px solid #dfebf3;background:#fff;border-radius:14px;padding:12px 10px}.cat.on{background:#103c5d;color:white}.head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.head h2{margin:0;font-size:20px}
.popular,.products{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid #deebf3;border-radius:16px;overflow:hidden;position:relative}.pic{height:126px;background:linear-gradient(135deg,#dff1ff,#fff);display:grid;place-items:center;font-size:58px}.body{padding:11px}.body b{display:block;font-size:14px}.price{font-weight:900;margin-top:5px}.add{position:absolute;right:9px;bottom:9px;width:32px;height:32px;border-radius:50%;border:0;background:#103c5d;color:#fff}
.cart{background:#fff;border-left:1px solid #deebf3;padding:20px 16px;display:flex;flex-direction:column;min-height:100vh}.cart h2{margin:0}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.type{border:1px solid #e0e9ef;background:#f8fafc;border-radius:11px;padding:10px 4px;font-size:11px}.type.on{background:#103c5d;color:#fff}.tables{display:flex;gap:7px;margin-bottom:12px}.tbl{border:0;background:#f2f6f9;border-radius:9px;padding:9px 12px}.tbl.on{background:#1688f8;color:#fff}.items{flex:1}.line{display:grid;grid-template-columns:50px 1fr auto;gap:9px;padding:12px 0;border-bottom:1px solid #eef2f5;align-items:center}.thumb{height:50px;border-radius:11px;background:#e9f5ff;display:grid;place-items:center;font-size:27px}.mut{font-size:11px;color:#748899}.qty button{border:0;background:#eef5fa;border-radius:7px;width:26px;height:26px}.del{border:0;background:transparent;color:#df4545}.summary{border-top:1px solid #e7edf1;padding-top:12px}.sumline{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}.total{font-size:22px;font-weight:950;margin:10px 0}.pay{border:0;background:linear-gradient(135deg,#0f4770,#1688f8);color:white;border-radius:13px;padding:15px;font-weight:900;font-size:16px;width:100%}.payments{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.payments button{border:1px solid #dce8f1;background:#f8fbfd;border-radius:11px;padding:11px}
.mobileCart{display:none}
@media(max-width:900px){.app{display:block}.side{display:none}.center{padding:14px 13px 105px}.popular,.products{grid-template-columns:repeat(2,1fr)}.cart{display:none}.pic{height:120px}.categories{margin:12px 0}.mobileCart{display:flex;position:fixed;bottom:14px;left:12px;right:12px;background:#103c5d;color:#fff;padding:13px 15px;border-radius:15px;justify-content:space-between;align-items:center;box-shadow:0 10px 30px #082a444d;z-index:20}.mobileCart button{border:0;background:#1688f8;color:white;border-radius:10px;padding:9px 13px}}
</style></head><body>
<div class="app">
<aside class="side"><div class="brand">NOVA<span style="color:#65c0ff">OS</span><small>RESTAURANT CLOUD</small></div>
<button class="nav on"><span>⌂</span>หน้าขาย (POS)</button><button class="nav"><span>▣</span>สินค้า</button><button class="nav"><span>▤</span>ออเดอร์</button><button class="nav"><span>♙</span>ลูกค้า</button><button class="nav"><span>◒</span>รายงาน</button><button class="nav"><span>⚙</span>ตั้งค่า</button>
<div class="quote">☁ Cloud Online<br><b>AMATA • POS-01</b><br><span style="opacity:.65">NOVA Restaurant OS</span></div></aside>
<main class="center"><div class="top"><input id="search" class="search" placeholder="⌕ ค้นหาเมนู เช่น IPA, ริบอาย, พิซซ่า..." oninput="render()"><button class="iconbtn">▣</button><button class="iconbtn">🔔</button></div>
<div class="categories"><button class="cat on">✦<br>ทั้งหมด</button><button class="cat">🍺<br>เบียร์</button><button class="cat">🥩<br>สเต๊ก</button><button class="cat">🍕<br>พิซซ่า</button><button class="cat">🍗<br>ของทอด</button><button class="cat">🥤<br>เครื่องดื่ม</button></div>
<div class="head"><h2>เมนูยอดนิยม</h2><span class="mut">ดูทั้งหมด ›</span></div><div class="popular" id="popular"></div>
<div class="head"><h2>เมนูทั้งหมด</h2><span class="mut">▦ Grid View</span></div><div class="products" id="products"></div></main>
<aside class="cart"><div style="display:flex;justify-content:space-between"><div><h2>ออเดอร์ #A001</h2><span class="mut">พนักงาน: Admin</span></div><b>⋮</b></div>
<div class="types"><button class="type on">🍽 ทานที่ร้าน</button><button class="type">🛍 กลับบ้าน</button><button class="type">🛵 เดลิเวอรี</button></div><b style="font-size:12px;margin-bottom:7px">โต๊ะ</b><div class="tables"><button class="tbl on">T08</button><button class="tbl">T09</button><button class="tbl">T10</button><button class="tbl">...</button></div>
<div class="items" id="items"></div><div class="summary"><div class="sumline"><span>จำนวนรายการ</span><b id="count">0</b></div><div class="sumline"><span>รวมสินค้า</span><b id="sub">฿0</b></div><div class="sumline"><span>ส่วนลด</span><span>เลือกส่วนลด ›</span></div><div class="sumline"><span>ภาษี (7%)</span><b id="vat">฿0</b></div><div class="sumline total"><span>ยอดรวม</span><span id="total">฿0</span></div><button class="pay" onclick="alert('Payment Demo • Cash / QR / Card / TrueMoney')">▣ ชำระเงิน</button><div class="payments"><button>💵 เงินสด</button><button>▦ สแกนจ่าย</button></div></div></aside>
</div><div class="mobileCart"><div><b><span id="mcount">0</span> รายการ • T08</b><br><span id="mtotal">฿0</span></div><button onclick="alert('Mobile: เปิด Order Bottom Sheet')">ดูออเดอร์</button></div>
<script>
const menu=[['Oktoberfest Bier',180,'🍺'],['Salmon Pizza L',189,'🍕'],['Ribeye Steak',380,'🥩'],['BBQ Ribs',280,'🍖'],['IPA 500 ml',160,'🍺'],['Weizen Dunkel',160,'🍺'],['Stout 500 ml',160,'🍺'],['Chicken Wings',120,'🍗'],['French Fries',100,'🍟'],['Spicy Salad',140,'🥗'],['Soda',30,'🥤'],['Cola Zero',40,'🥤']];
let cart=[{n:'Oktoberfest Bier',p:180,e:'🍺',q:2},{n:'Salmon Pizza L',p:189,e:'🍕',q:1}];
function cards(arr){return arr.map(x=>`<div class="card"><div class="pic">${x[2]}</div><div class="body"><b>${x[0]}</b><div class="price">฿${x[1]}</div></div><button class="add" onclick="add('${x[0]}')">+</button></div>`).join('')}
function render(){let q=search.value.toLowerCase(),f=menu.filter(x=>x[0].toLowerCase().includes(q));popular.innerHTML=cards(f.slice(0,4));products.innerHTML=cards(f)}
function add(n){let m=menu.find(x=>x[0]===n),r=cart.find(x=>x.n===n);r?r.q++:cart.push({n:m[0],p:m[1],e:m[2],q:1});update()}
function qty(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);update()}function removeItem(i){cart.splice(i,1);update()}
function update(){items.innerHTML=cart.map((x,i)=>`<div class="line"><div class="thumb">${x.e}</div><div><b>${x.n}</b><div class="mut">ปกติ • เพิ่มหมายเหตุ</div><div class="qty"><button onclick="qty(${i},-1)">−</button> <b>${x.q}</b> <button onclick="qty(${i},1)">+</button></div></div><div style="text-align:right"><button class="del" onclick="removeItem(${i})">⌫</button><br><b>฿${x.p*x.q}</b></div></div>`).join('');let s=cart.reduce((a,x)=>a+x.p*x.q,0),c=cart.reduce((a,x)=>a+x.q,0),v=s*.07,t=s+v;count.textContent=c;sub.textContent='฿'+s.toFixed(2);vat.textContent='฿'+v.toFixed(2);total.textContent='฿'+t.toFixed(2);mcount.textContent=c;mtotal.textContent='฿'+t.toFixed(2)}
render();update();
</script></body></html>
